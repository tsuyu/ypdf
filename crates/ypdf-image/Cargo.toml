[package]
name = "ypdf-image"
description = "Images into PDF pages: one picture per page, or a contact sheet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
lopdf = "0.44.0"
tracing = "0.1.44"
ypdf-core = { path = "../ypdf-core" }
ypdf-doc = { path = "../ypdf-doc" }
