[package]
name = "ypdf-sign"
description = "Digital signatures: reading, verifying, and reporting on what a signature actually covers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
ypdf-core = { path = "../ypdf-core" }
ypdf-doc = { path = "../ypdf-doc" }
lopdf = "0.44.0"
tracing = "0.1.44"
cms = "0.2"
x509-cert = "0.2"
der = "0.7"
const-oid = "0.9"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
rsa = "0.9"
signature = "2"
p256 = "0.13"
p384 = "0.13"
ecdsa = "0.16"
pkcs1 = "0.7"

[dev-dependencies]
lopdf = "0.44.0"
cms = { version = "0.2", features = ["builder"] }
x509-cert = { version = "0.2", features = ["builder"] }
p256 = "0.13"
der = "0.7"
const-oid = "0.9"
sha2 = { version = "0.10", features = ["oid"] }
signature = "2"
